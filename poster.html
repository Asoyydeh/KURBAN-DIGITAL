<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Kurban Digital</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --green: #085a40;
            /* Dark green dari referensi */
            --gold: #b89053;
            --bg: #fdfcf9;
            /* Off-white / light cream */
            --text: #333333;
            --light-green: #e6f2ee;
            /* Untuk background icon */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- POSTER CONTAINER --- */
        .poster {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            /* MENGGUNAKAN GAMBAR AI SEBAGAI BACKGROUND UTAMA */
            background-image: url('promo_poster.png');
            background-size: 1080px 1080px;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- OVERLAY PENUTUP TEKS NGACO (PATCHES) --- */
        /* Kotak putih untuk menutupi daftar fitur utama yang ngaco */
        .patch-fitur {
            position: absolute;
            top: 280px;
            left: 55px;
            width: 300px;
            height: 500px;
            background: #ffffff;
            /* Warna putih solid menutupi teks lama */
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
            padding: 20px;
        }

        /* Kotak untuk menutupi bagian Keunggulan di bawah */
        .patch-keunggulan {
            position: absolute;
            bottom: 40px;
            left: 45px;
            width: 490px;
            height: 170px;
            background: #fcfcfc;
            /* Warna krem/putih bawah */
            z-index: 10;
            padding: 10px;
        }

        /* Kotak untuk menutupi bagian Cocok Untuk di bawah */
        .patch-cocok {
            position: absolute;
            bottom: 40px;
            right: 45px;
            width: 450px;
            height: 170px;
            background: #fcfcfc;
            z-index: 10;
            padding: 10px;
        }

        /* --- STYLING TEKS & ICON BARU --- */
        .feature-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-circle {
            width: 55px;
            height: 55px;
            background: var(--light-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--green);
            flex-shrink: 0;
            border: 1px solid rgba(6, 95, 70, 0.1);
        }

        .icon-circle svg {
            width: 28px;
            height: 28px;
            stroke-width: 2;
        }

        .feature-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }

        .feature-text span {
            display: block;
            font-size: 0.9rem;
            font-weight: 400;
            color: #666;
            margin-top: 4px;
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            height: 100%;
            align-items: center;
            row-gap: 10px;
            column-gap: 10px;
        }

        .grid-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(217, 119, 6, 0.1);
        }

        .grid-icon {
            color: var(--green);
        }

        .grid-icon svg {
            width: 26px;
            height: 26px;
            stroke-width: 2.5;
        }

        .grid-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
    </style>
</head>

<body>

    <div class="poster">

        <!-- PATCH KIRI (FITUR UTAMA) -->
        <div class="patch-fitur">
            <div class="feature-item">
                <div class="icon-circle">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                </div>
                <div class="feature-text">Live Tracker<span>Statistik Realtime</span></div>
            </div>
            <div class="feature-item">
                <div class="icon-circle">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z">
                        </path>
                    </svg>
                </div>
                <div class="feature-text">Live Streaming<span>Saksikan Penyembelihan</span></div>
            </div>
            <div class="feature-item">
                <div class="icon-circle">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                </div>
                <div class="feature-text">E-Sertifikat & QR<span>Cetak Bukti Instan</span></div>
            </div>
            <div class="feature-item">
                <div class="icon-circle">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z">
                        </path>
                    </svg>
                </div>
                <div class="feature-text">Donasi Terbuka<span>Operasional Amanah</span></div>
            </div>
        </div>

        <!-- PATCH BAWAH KIRI (KEUNGGULAN) -->
        <div class="patch-keunggulan">
            <div class="grid-2x2">
                <div class="grid-item">
                    <div class="grid-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div class="grid-text">Transparan &<br>Realtime</div>
                </div>
                <div class="grid-item">
                    <div class="grid-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                    </div>
                    <div class="grid-text">Privasi Data<br>Aman</div>
                </div>
                <div class="grid-item">
                    <div class="grid-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                    </div>
                    <div class="grid-text">Manajemen<br>Efisien</div>
                </div>
                <div class="grid-item">
                    <div class="grid-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div class="grid-text">Sesuai<br>Syari'at</div>
                </div>
            </div>
        </div>

        <!-- PATCH BAWAH KANAN (COCOK UNTUK) -->
        <div class="patch-cocok">
            <div class="grid-2x2">
                <div class="grid-item">
                    <div class="grid-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9">
                            </path>
                        </svg>
                    </div>
                    <div class="grid-text">Masjid &<br>Musholla</div>
                </div>
                <div class="grid-item">
                    <div class="grid-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                            </path>
                        </svg>
                    </div>
                    <div class="grid-text">Panitia<br>Kurban</div>
                </div>
                <div class="grid-item">
                    <div class="grid-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <div class="grid-text">Shohibul<br>Kurban</div>
                </div>
                <div class="grid-item">
                    <div class="grid-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                            </path>
                        </svg>
                    </div>
                    <div class="grid-text">Lembaga<br>ZISWAF</div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
